<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img">
    <title>Rocket</title>
    <defs>
        <linearGradient id="r-body" x1="19" y1="4" x2="46" y2="49" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#7CC4FF"/>
            <stop offset="1" stop-color="#2F74C0"/>
        </linearGradient>
        <linearGradient id="r-fin" x1="9" y1="33" x2="55" y2="53" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#2C6DB5"/>
            <stop offset="1" stop-color="#1B4E8A"/>
        </linearGradient>
        <linearGradient id="r-flame" x1="32" y1="45" x2="32" y2="61" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFD36B"/>
            <stop offset="1" stop-color="#F4623A"/>
        </linearGradient>
    </defs>

    <!-- exhaust -->
    <path d="M32 61C27.5 55.5 25.5 51 25.5 45.5L38.5 45.5C38.5 51 36.5 55.5 32 61Z" fill="url(#r-flame)"/>
    <path d="M32 54C30 51 29.5 49 29.5 45.5L34.5 45.5C34.5 49 34 51 32 54Z" fill="#FFEFC2" opacity=".75"/>

    <!-- fins -->
    <path d="M21 33C14.5 38 10.5 45 9.5 53L21 46Z" fill="url(#r-fin)"/>
    <path d="M43 33C49.5 38 53.5 45 54.5 53L43 46Z" fill="url(#r-fin)"/>

    <!-- fuselage -->
    <path d="M32 3C39.5 10.5 43.5 22 43.5 32.5L43.5 46C40 48 36 49 32 49C28 49 24 48 20.5 46L20.5 32.5C20.5 22 24.5 10.5 32 3Z" fill="url(#r-body)"/>
    <path d="M32 3C27 9.5 24.5 17.5 23.5 25.5L26.5 25.5C27.5 17.5 29.5 9.5 32 3Z" fill="#FFFFFF" opacity=".3"/>

    <!-- porthole -->
    <circle cx="32" cy="24" r="6.5" fill="#0E2E4F"/>
    <circle cx="32" cy="24" r="6.5" fill="none" stroke="#A9D8FF" stroke-width="1.6"/>
    <circle cx="29.8" cy="21.8" r="2.1" fill="#7CC4FF" opacity=".6"/>
</svg>
